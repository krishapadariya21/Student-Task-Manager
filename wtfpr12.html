<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="csspr12.css">
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your studies and manage your time!</p>
    </header>

    <main class="container">

        <section class="task-box">

            <h2>Add Your Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    maxlength="100"
                    required
                >

                <button type="submit">
                    Add Task
                </button>

            </form>

            <h2>My Tasks</h2>

            <p id="taskCount">Total Tasks: 0</p>

            <ul id="taskList"></ul>

        </section>

    </main>

    <footer>
        <p>© 2026 Student Task Manager</p>
    </footer>

    <script src="scriptpr12.js"></script>

</body>
</html>
